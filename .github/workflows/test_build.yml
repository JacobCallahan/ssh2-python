name: Test Builds

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "*.md"
      - "examples/**"
      - "doc/**"

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    outputs:
      sdist_file: ${{ steps.save-path.outputs.sdist_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

      - name: Output sdist name
        id: save-path
        shell: bash
        run: echo "sdist_name=$(ls dist)" >> "$GITHUB_OUTPUT"

  build_wheels:
    name: Build ${{ matrix.os }} - ${{ matrix.python-version }}
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake openssh-server libssh2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
        # run: brew install cmake libssh2

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install -y cmake openssl
        # run: choco install -y cmake openssl libssh2

      - name: Install build requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements_build.txt

      - name: Build libssh2
        shell: bash
        run: python _setup_libssh2.py

      - name: Check contents of the libssh2 install directory
        run: ls -R build_dir/libssh2_install

      - name: Set environment variables for libssh2
        run: |
          echo "CFLAGS=-I$(pwd)/build_dir/libssh2_install/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(pwd)/build_dir/libssh2_install/lib" >> $GITHUB_ENV

      - name: Build wheel
        run: |
          python setup.py build_ext --inplace
          python -m build --wheel

      # - name: Test
      #   run: pytest tests/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl

