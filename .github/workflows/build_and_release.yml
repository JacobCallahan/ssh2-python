name: Build and Release

on:
  push:
    branches:
      - master
  release:
    types:
      - published

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    outputs:
      sdist_file: ${{ steps.save-path.outputs.sdist_name }}
    steps:
      - name: Checkout ssh2-python
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*

  build_wheels:
    name: Build Wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cibw_python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout ssh2-python
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.cibw_python }}

      - name: Install python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Build normal wheels
        uses: pypa/cibuildwheel@v2.17
        with:
          package-dir: ./dist/${{ startsWith(matrix.os, 'macos') && env.sdist_name || needs.build_sdist.outputs.sdist_file }}
        env:
          CIBW_SKIP: "*musllinux*"
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_PRERELEASE_PYTHONS: true
          CIBW_BEFORE_ALL_LINUX: "yum install -y cmake openssh-server openssl-devel"
          CIBW_BEFORE_ALL_MACOS: "brew install cmake libssh2"
          CIBW_BEFORE_ALL_WINDOWS: "choco install cmake openssh"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v2
        with:
          name: sdist
          path: ./dist

      - name: Download wheels
        uses: actions/download-artifact@v2
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.4.2
        with:
          user: __token__
          password: ${{ secrets.pypi_token }}
